name: defenders

# Les secrets (mots de passe) viennent du fichier .env à la racine — voir .env.example.

services:
  db:
    image: postgres:17-alpine
    container_name: defenders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-defenders_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - defenders-net
    # Exposé sur la machine locale : utilisé par le backend en mode `npm run dev`.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: defenders-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-defenders_dev}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env (voir .env.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_TO: ${CONTACT_TO:-ahannachi193@gmail.com}
    volumes:
      # Images et vidéos téléversées depuis l'espace admin
      - uploads:/app/uploads
      - backend_uploads:/app/src/assets/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - defenders-net
    # Exposé uniquement sur la machine locale (pratique pour tester l'API).
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    container_name: defenders-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Le frontend parle à l'API via le nom du service sur le réseau Docker.
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - defenders-net
    ports:
      - "127.0.0.1:3001:3000"

networks:
  defenders-net:
    driver: bridge

volumes:
  # Données PostgreSQL (demandes de contact, admins, sessions).
  pgdata:
  backend_uploads:
  # Images et vidéos téléversées (espace admin > Médias).
  uploads:
